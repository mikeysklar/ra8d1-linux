# Emulated MMU RISC-V Linux host app - board-neutral configuration.
#
# Everything here is true of the app on any Zephyr board. Board-specific
# symbols live in boards/<board>.conf, which Zephyr merges on top of this
# file. If a symbol's name contains a vendor or a part number it belongs
# there, not here.

CONFIG_PRINTK=y
CONFIG_BOOT_BANNER=n

# Interrupt-driven console receive. Not a tuning knob: with polled input the
# guest samples the UART once per emulator slice (~667 us) and holds one byte,
# so a line pasted at wire speed loses its newline and hangs the guest shell
# forever. Measured identically at 921600 and 460800, which is what ruled out
# the baud rate. See CONFIG_RVT_UART_RX_RING and BUILD.md gotcha 17.
CONFIG_UART_INTERRUPT_DRIVEN=y

# main() runs the emulator directly. The stack holds only main's own frame
# plus the interpreter's, which is shallow: the CPU state and every device is
# in .bss. The one large frame is the virtio descriptor chain, which is
# VIRTIO_MAX_CHAIN * 16 bytes.
CONFIG_MAIN_STACK_SIZE=8192

# Both images are read through the memory-mapped flash window, not through
# flash_read(), so no driver call is on the path. The driver still has to be
# built and to run: it is what puts the octo-SPI controller into octal DTR
# mode, and without that the memory-mapped window does not work at all.
CONFIG_FLASH=y

# crc32_ieee() for the image check.
CONFIG_CRC=y

# Paravirt I/O bridge: the guest drives these through MMIO at 0x11200000.
CONFIG_GPIO=y
CONFIG_I2C=y

CONFIG_SPEED_OPTIMIZATIONS=y

# --------------------------------------------------------------- networking
#
# Only here to carry the guest console over TCP, so `telnet <board-ip>` lands
# on the guest's shell. The guest kernel has no IP stack of its own and does
# not need one: this is the *host* stack, and plat_putc()/plat_getc() - which
# are both ends of the guest's console already - get routed to a socket.
#
# The vendor Ethernet, MDIO and PHY driver symbols live in
# boards/ek_ra8d1.conf, per the rule at the top of this file. CONFIG_NETWORKING
# is what makes their menus exist at all: they default y off the devicetree,
# but the menus only appear once NET_L2_ETHERNET is on.
CONFIG_NETWORKING=y
CONFIG_NET_L2_ETHERNET=y
CONFIG_NET_IPV4=y
CONFIG_NET_IPV6=n
CONFIG_NET_TCP=y
CONFIG_NET_UDP=y
CONFIG_NET_SOCKETS=y
CONFIG_NET_DHCPV4=y
CONFIG_NET_ARP=y

# One telnet client, plus DHCP and ARP. Sized small deliberately: the packet
# pool lives in internal SRAM and the guest's 64 MB is external SDRAM, so these
# do not compete for the guest's memory, but there is no reason to be generous.
CONFIG_NET_PKT_RX_COUNT=16
CONFIG_NET_PKT_TX_COUNT=16
CONFIG_NET_BUF_RX_COUNT=32
CONFIG_NET_BUF_TX_COUNT=32
CONFIG_NET_MAX_CONTEXTS=6
CONFIG_NET_MAX_CONN=6

# Detect a client that vanished without a FIN, so the console reverts to the
# UART instead of staying wedged in "telnet attached" forever.
CONFIG_NET_TCP_KEEPALIVE=y

# SO_RCVTIMEO. The image pusher enforces its own timeouts with zsock_poll() and
# does not depend on this, but it sets the option too and reports the failure if
# it is refused - on the rvlinux board a missing RCVTIMEO left the loader
# blocked in recv() forever, which wedged the whole service until a reset. Both
# halves are cheap; only one of them can be forgotten in a config file.
CONFIG_NET_CONTEXT_RCVTIMEO=y

# The emulator loop never blocks and never yields, so every networking thread
# must outrank it. main() drops itself to CONFIG_RVT_EMU_PRIORITY before the
# image check; see the comment there.
CONFIG_MAIN_THREAD_PRIORITY=0
