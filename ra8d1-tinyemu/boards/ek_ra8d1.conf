# EK-RA8D1 specific Kconfig.
#
# Merged on top of prj.conf (Zephyr appends prj.conf, then socs/, then
# boards/ - see cmake/modules/configuration_files.cmake).

# SDRAM controller. The board DTS marks &sdram okay but the memc driver class
# still has to be enabled, and nothing on this board does it for us.
CONFIG_MEMC=y

# D-cache is a 3.8x swing on SDRAM reads on this board (123 vs 32 MiB/s
# measured by the mini-rv32ima port), and guest RAM is SDRAM, so every guest
# load and store is on the other side of this switch.
CONFIG_ICACHE=y
CONFIG_DCACHE=y
CONFIG_CACHE_MANAGEMENT=y

# Ethernet, for the telnet console. All three default y off DT_HAS_*_ENABLED -
# &eth, &mdio and phy@5 are already status = "okay" in the board DTS - but they
# are stated explicitly so an upstream default change cannot quietly drop the
# link. Requires SW1-5 ON; SW1-7 (SDRAM) stays ON, which the Renesas switch
# table implies is exclusive and is not: verified, SDRAM still reports 64 MB.
#
# ETH_RENESAS_RA selects NOCACHE_MEMORY, which is load-bearing here rather than
# incidental: we run CONFIG_DCACHE=y, and without the nocache placement the
# EDMAC descriptors would be read through a stale cache line.
CONFIG_ETH_RENESAS_RA=y
CONFIG_MDIO=y
CONFIG_MDIO_RENESAS_RA=y
CONFIG_PHY_GENERIC_MII=y

# The default 1500 B is tight once the L2 path is inlined into this thread.
CONFIG_ETH_RA_RX_THREAD_STACK_SIZE=2048

# Entropy for TCP initial sequence numbers comes from the real TRNG rather
# than the timer fallback.
CONFIG_ENTROPY_RENESAS_RA=y
