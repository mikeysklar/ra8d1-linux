# Native Z80 arcade emulator - board-neutral configuration.
#
# Everything here is true of the app on any Zephyr board. Board-specific
# symbols live in boards/<board>.conf, which Zephyr merges on top of this
# file. If you find yourself adding a symbol here whose name contains a
# vendor or a part number, it belongs in the board file instead.

CONFIG_PRINTK=y
CONFIG_BOOT_BANNER=n
CONFIG_MAIN_STACK_SIZE=8192

# The ROM image lives in a flash partition labelled "arcade-rom", declared by
# the board overlay. Which flash, and where, is the board's business.
CONFIG_FLASH=y

# Display output. The app runs headless without this - src/main.c only
# references video.h under CONFIG_DISPLAY - so the display stage can be
# built and landed independently of the emulator.
CONFIG_DISPLAY=y

# The emulator state is ~118 KB of .bss and we want it in internal SRAM, not
# SDRAM: the Z80's whole address space is 20 KB and keeping it on-chip is the
# single biggest win available to the interpreter.
CONFIG_SPEED_OPTIMIZATIONS=y
CONFIG_CRC=y
