# EK-RA8D1 specific Kconfig for the arcade app.
#
# Merged on top of prj.conf (Zephyr appends prj.conf, then socs/, then
# boards/ - see cmake/modules/configuration_files.cmake). Only symbols that
# are true of THIS board belong here; anything the app needs on every board
# belongs in prj.conf.

# SDRAM controller. The board DTS marks &sdram okay but the memc driver class
# still has to be enabled, and on this board nothing enables it for us. Other
# boards do: stm32f746g_disco's Kconfig.defconfig has
# "config MEMC / default y if STM32_LTDC", because its display controller
# needs it. That is the board doing its own job, which is why this line is
# here rather than in prj.conf.
CONFIG_MEMC=y

# MIPI-DSI host and the GLCDC. Both are `default y` on their devicetree
# dependency once SHIELD=rtkmipilcdb00000be is applied, so these are
# belt-and-braces rather than load-bearing.
CONFIG_MIPI_DSI=y
CONFIG_RENESAS_RA_GLCDC=y

# One GLCDC framebuffer rather than the default two.
#
# For this app it is purely a memory saving: every hazard in the two-buffer
# path lives inside ra_display_write(), and src/video.c never calls it - it
# drives the GLCDC through FSP directly. At the default of 2 we would just
# reserve a second 819,840-byte buffer in SDRAM that nothing ever touches.
#
# Do NOT set this to 0. At 0 the driver's framebuffer becomes a zero-length
# array while display_get_framebuffer() still returns a non-NULL pointer into
# it, and plat_video_init() memsets 819,840 bytes through that pointer.
CONFIG_RENESAS_RA_GLCDC_FB_NUM=1

# The GT911 touch controller on the MIPI shield shares the DSI reset line
# with the panel, so the panel does not come up without I2C available.
CONFIG_I2C=y

# D-cache is a 3.8x swing on SDRAM reads on this board (123 vs 32 MiB/s), and
# the GLCDC scans out of SDRAM as a bus master that does not see the cache,
# so cache maintenance has to be available for video.c to flush against.
CONFIG_ICACHE=y
CONFIG_DCACHE=y
CONFIG_CACHE_MANAGEMENT=y
