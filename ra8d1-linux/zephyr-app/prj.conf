# Minimal standalone Zephyr app for EK-RA8D1: console + full 64 MB SDRAM proof.

CONFIG_PRINTK=y
CONFIG_BOOT_BANNER=y
CONFIG_MAIN_STACK_SIZE=4096

# SDRAM controller (SDRC). The ek_ra8d1 board DTS already sets &sdram okay,
# but the memc driver class has to be turned on for it to be initialised.
CONFIG_MEMC=y

# Caches. The Cortex-M85 D-cache is what makes SDRAM streaming usable at all;
# without it every access is a single-beat SDRAM transaction.
CONFIG_ICACHE=y
CONFIG_DCACHE=y
CONFIG_CACHE_MANAGEMENT=y

CONFIG_SPEED_OPTIMIZATIONS=y
