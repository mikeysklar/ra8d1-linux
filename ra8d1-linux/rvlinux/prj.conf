# Emulated RISC-V Linux host app for EK-RA8D1.

CONFIG_PRINTK=y
CONFIG_BOOT_BANNER=n
CONFIG_MAIN_STACK_SIZE=8192

# SDRAM controller: board DTS has &sdram okay, memc class must be enabled.
CONFIG_MEMC=y

# Octo-SPI NOR holding the guest image (memory-mapped at 0x90000000).
CONFIG_FLASH=y

# D-cache is a 3.8x swing on SDRAM reads (123 vs 32 MiB/s measured).
CONFIG_ICACHE=y
CONFIG_DCACHE=y
CONFIG_CACHE_MANAGEMENT=y

CONFIG_SPEED_OPTIMIZATIONS=y

# crc32_ieee() for image verification
CONFIG_CRC=y

# Paravirt I/O bridge: the guest drives these through MMIO at 0x11200000.
CONFIG_GPIO=y
CONFIG_I2C=y

# --------------------------------------------------------------- networking
#
# Only here to carry the guest console over TCP. The guest itself has
# CONFIG_NET=n and no IP stack of its own; this is the *host* stack, and the
# emulated 8250's two ends get routed to a socket.
#
# The RA Ethernet driver, its MDIO and the generic MII PHY all default to y off
# the devicetree (renesas,ra-ethernet / renesas,ra-mdio / ethernet-phy are
# already status = "okay" in the board DTS), but their Kconfig menus live under
# the ethernet driver class, which only exists once NET_L2_ETHERNET is on. So
# CONFIG_NETWORKING is the switch that pulls the whole chain in; the symbols
# below are stated explicitly so a change in a default cannot silently drop the
# link out from under us.
CONFIG_NETWORKING=y
CONFIG_NET_L2_ETHERNET=y
CONFIG_NET_IPV4=y
CONFIG_NET_IPV6=n
CONFIG_NET_TCP=y
CONFIG_NET_UDP=y
CONFIG_NET_SOCKETS=y
CONFIG_NET_DHCPV4=y
CONFIG_NET_ARP=y

CONFIG_ETH_RENESAS_RA=y
CONFIG_MDIO=y
CONFIG_MDIO_RENESAS_RA=y
CONFIG_PHY_GENERIC_MII=y

# The default 1500 B is tight once the L2 path is inlined into this thread.
CONFIG_ETH_RA_RX_THREAD_STACK_SIZE=2048

# One telnet client, plus DHCP and ARP. Sized small deliberately: the packet
# pool lives in internal SRAM and the guest's 64 MB is in SDRAM, so these do
# not compete, but there is no reason to be generous either.
CONFIG_NET_PKT_RX_COUNT=16
CONFIG_NET_PKT_TX_COUNT=16
CONFIG_NET_BUF_RX_COUNT=32
CONFIG_NET_BUF_TX_COUNT=32
CONFIG_NET_MAX_CONTEXTS=6
CONFIG_NET_MAX_CONN=6

# Detect a client that vanished without a FIN, so the console reverts to the
# UART instead of staying wedged in "telnet attached" forever.
CONFIG_NET_TCP_KEEPALIVE=y

# Makes SO_RCVTIMEO actually exist. Without it Zephyr's setsockopt fails the
# option outright and the socket keeps blocking forever, which is what left a
# failed image push wedging the loader service until the board was reset. The
# push path no longer depends on this -- it polls with its own timeout -- but
# an option that silently does nothing is worth removing regardless.
CONFIG_NET_CONTEXT_RCVTIMEO=y

# The emulator loop never blocks, so every networking thread must outrank it.
# main() drops its own priority to CONFIG_RVL_EMU_PRIORITY before entering the
# step loop; see the comment there.
CONFIG_MAIN_THREAD_PRIORITY=0
